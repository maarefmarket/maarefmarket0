<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول · لوحة التحكم CampusKart</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="../assets/logo.svg" alt="CampusKart" class="logo-lg">
      <h1>لوحة التحكم</h1>
      <p class="subtitle" data-brand-name>CampusKart</p>

      <div class="form-field">
        <label for="pw">كلمة المرور</label>
        <input type="password" id="pw" placeholder="أدخل كلمة المرور" autocomplete="current-password">
      </div>

      <button class="btn btn-primary btn-block btn-lg" id="loginBtn">دخول</button>
    </div>
  </div>

  <script src="../js/data-store.js"></script>
  <script src="../js/currency.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    (async function() {
      await DataStore.load();
      Theme.init();
      UI.updateBrand();

      // إذا كان مسجل دخول مسبقًا → توجه للوحة
      if (DataStore.isAdminLoggedIn()) {
        location.href = 'dashboard.html';
        return;
      }

      const pwInput = document.getElementById('pw');
      const btn = document.getElementById('loginBtn');

async function tryLogin() {
  const pw = pwInput.value.trim();

  if (!pw) {
    UI.toast('أدخل كلمة المرور', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'جاري التحقق...';

  try {
    const res = await fetch('/api/data', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + pw
      },
      body: JSON.stringify(DataStore.get())
    });

    if (res.ok) {
      sessionStorage.setItem('ck_admin_password', pw);
      DataStore.loginAdmin();
      UI.toast('مرحبًا بك!', 'success');

      setTimeout(() => {
        location.href = 'dashboard.html';
      }, 400);

    } else if (res.status === 401) {
      UI.toast('كلمة مرور خاطئة', 'error');
      pwInput.value = '';
      pwInput.focus();

    } else {
      UI.toast('حدث خطأ في الاتصال', 'error');
    }

  } catch (e) {
    UI.toast('تعذر الاتصال بالخادم', 'error');
  }

  btn.disabled = false;
  btn.textContent = 'دخول';
}

      btn.addEventListener('click', tryLogin);
      pwInput.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') tryLogin();
      });
      pwInput.focus();
    })();
  </script>
</body>
</html>
