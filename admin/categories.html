<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأقسام · لوحة التحكم CampusKart</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-body">
  <div class="admin-mask" id="adminMask"></div>
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <img src="../assets/logo.svg" alt="CampusKart">
      <div>
        <div class="b-name" data-brand-name>CampusKart</div>
        <div class="b-sub">لوحة التحكم</div>
      </div>
    </div>
    <nav class="admin-nav">
      <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>الرئيسية</a>
      <a href="hero.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>اللوحة العلوية</a>
      <a href="categories.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>الأقسام</a>
      <a href="products.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>المنتجات</a>
      <a href="rates.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>أسعار الصرف</a>
      <a href="message.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>رسالة واتساب</a>
      <a href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"/></svg>الإعدادات</a>
    </nav>
    <div class="admin-sidebar-foot">
      <button class="btn" data-theme-toggle></button>
      <a class="btn" href="../index.html">🛍️</a>
      <button class="btn btn-danger" id="logoutBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </aside>

  <main class="admin-main">
    <button class="mobile-menu-btn" id="mobileMenuBtn" style="margin-bottom:12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <div class="admin-topbar">
      <h1>إدارة الأقسام</h1>
      <div class="actions">
        <button class="btn btn-primary" id="addCatBtn">+ إضافة قسم</button>
        <button class="btn" data-download-json>📥 تنزيل JSON</button>
      </div>
    </div>

    <div class="panel">
      <p class="panel-desc">أزرار الأسهم لترتيب الأقسام، والعين للإخفاء/الإظهار دون حذف.</p>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:80px">ترتيب</th>
              <th>الأيقونة/الصورة</th>
              <th>الاسم</th>
              <th>المعرّف</th>
              <th>عدد المنتجات</th>
              <th style="text-align:left">إجراءات</th>
            </tr>
          </thead>
          <tbody id="catsTbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-mask" id="catModal">
  <div class="modal">
    <h3 id="catModalTitle">إضافة قسم</h3>
    <div class="form-row-2">
      <div class="form-field">
        <label for="fCatName">الاسم *</label>
        <input type="text" id="fCatName" placeholder="مثال: الشيبسات">
      </div>
      <div class="form-field">
        <label for="fCatId">المعرّف (id) *</label>
        <input type="text" id="fCatId" placeholder="chips">
        <small>بالإنجليزية بدون فراغات</small>
      </div>
    </div>
    <div class="form-field">
      <label for="fCatIcon">الأيقونة (Emoji)</label>
      <input type="text" id="fCatIcon" placeholder="🍟" maxlength="4">
      <small>تظهر إذا لم يتم رفع صورة</small>
    </div>
    <div class="form-field">
      <label>صورة القسم (اختياري — تحل محل الأيقونة)</label>
      <div id="fCatImage"></div>
    </div>
    <div class="form-field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="fCatVisible" checked>
        <span>عرض القسم في الموقع</span>
      </label>
    </div>
    <div class="modal-foot">
      <button class="btn" data-modal-close>إلغاء</button>
      <button class="btn btn-primary" id="saveCatBtn">حفظ</button>
    </div>
  </div>
</div>

<script src="../js/data-store.js"></script>
<script src="../js/currency.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/image-upload.js"></script>
<script src="../js/admin.js"></script>
<script>
(async function() {
  const ok = await Admin.init();
  if (!ok) return;
  const { $, $$, escapeHtml, toast } = UI;

  let editingId = null;
  let imgUploader = null;

  function render() {
    const cats = DataStore.getCategories(true); // كل الأقسام مع المخفية
    const rows = cats.map((c, idx) => {
      const count = DataStore.getProductsByCategory(c.id, true).length;
      const isFirst = idx === 0;
      const isLast = idx === cats.length - 1;
      const rowOpacity = c.visible === false ? 'opacity:0.5' : '';
      const iconContent = c.image
        ? `<img src="${escapeHtml(c.image)}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none';this.parentNode.textContent='${escapeHtml(c.icon || '📦')}'">`
        : escapeHtml(c.icon || '📦');
      return `
        <tr style="${rowOpacity}">
          <td>
            <div style="display:flex;gap:2px">
              <button class="icon-action" data-move-up="${escapeHtml(c.id)}" ${isFirst ? 'disabled' : ''}>↑</button>
              <button class="icon-action" data-move-down="${escapeHtml(c.id)}" ${isLast ? 'disabled' : ''}>↓</button>
            </div>
          </td>
          <td>
            <div style="width:44px;height:44px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--border);overflow:hidden">
              ${iconContent}
            </div>
          </td>
          <td><b>${escapeHtml(c.name)}</b></td>
          <td><code>${escapeHtml(c.id)}</code></td>
          <td>${count}</td>
          <td>
            <div class="tbl-actions">
              <button class="icon-action" data-toggle-vis="${escapeHtml(c.id)}" title="${c.visible ? 'إخفاء' : 'إظهار'}">
                ${c.visible
                  ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
                  : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
                }
              </button>
              <button class="icon-action" data-edit="${escapeHtml(c.id)}" title="تعديل">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button class="icon-action danger" data-del="${escapeHtml(c.id)}" title="حذف">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
              </button>
            </div>
          </td>
        </tr>`;
    }).join('');
    $('#catsTbody').innerHTML = rows || `<tr><td colspan="6" class="empty-state">لا توجد أقسام. اضغط "إضافة قسم" لبدء الإضافة.</td></tr>`;

    $$('[data-edit]').forEach(b => b.addEventListener('click', () => openModal(b.dataset.edit)));
    $$('[data-del]').forEach(b => b.addEventListener('click', () => deleteCategory(b.dataset.del)));
    $$('[data-toggle-vis]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.toggleVis;
      const c = DataStore.getCategory(id);
      if (!c) return;
      DataStore.updateCategory(id, { visible: !c.visible });
      toast(c.visible ? 'تم الإخفاء' : 'تم الإظهار');
      render();
    }));
    $$('[data-move-up]').forEach(b => b.addEventListener('click', () => {
      DataStore.moveCategoryUp(b.dataset.moveUp);
      render();
    }));
    $$('[data-move-down]').forEach(b => b.addEventListener('click', () => {
      DataStore.moveCategoryDown(b.dataset.moveDown);
      render();
    }));
  }

  function openModal(id) {
    editingId = id || null;
    if (id) {
      const c = DataStore.getCategory(id);
      $('#catModalTitle').textContent = 'تعديل قسم';
      $('#fCatName').value = c.name;
      $('#fCatId').value = c.id;
      $('#fCatIcon').value = c.icon || '';
      $('#fCatVisible').checked = c.visible !== false;
      imgUploader = ImageUpload.mount('#fCatImage', { initialValue: c.image || '' });
    } else {
      $('#catModalTitle').textContent = 'إضافة قسم';
      $('#fCatName').value = '';
      $('#fCatId').value = '';
      $('#fCatIcon').value = '';
      $('#fCatVisible').checked = true;
      imgUploader = ImageUpload.mount('#fCatImage', { initialValue: '' });
    }
    $('#catModal').classList.add('open');
    setTimeout(() => $('#fCatName').focus(), 100);
  }
  function closeModal() { $('#catModal').classList.remove('open'); }

  function saveCategory() {
    const name = $('#fCatName').value.trim();
    const id = $('#fCatId').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '_');
    const icon = $('#fCatIcon').value.trim();
    const visible = $('#fCatVisible').checked;
    const image = imgUploader ? imgUploader.getValue() : '';

    if (!name) { toast('أدخل اسم القسم', 'error'); return; }
    if (!id) { toast('أدخل معرّف القسم', 'error'); return; }

    if (editingId) {
      const ok = DataStore.updateCategory(editingId, { id, name, icon, image, visible });
      if (!ok) { toast('يوجد قسم آخر بنفس المعرّف', 'error'); return; }
      toast('تم التعديل بنجاح', 'success');
    } else {
      const ok = DataStore.addCategory({ id, name, icon, image, visible });
      if (!ok) { toast('يوجد قسم بنفس المعرّف', 'error'); return; }
      toast('تمت الإضافة بنجاح', 'success');
    }
    closeModal();
    render();
  }

  function deleteCategory(id) {
    const cat = DataStore.getCategory(id);
    if (!cat) return;
    const count = DataStore.getProductsByCategory(id, true).length;
    let confirmMsg = count > 0
      ? `القسم "${cat.name}" يحتوي على ${count} منتج. هل تريد حذفه مع جميع منتجاته؟`
      : `حذف قسم "${cat.name}"؟`;
    if (!confirm(confirmMsg)) return;
    DataStore.deleteCategory(id, count > 0);
    toast('تم الحذف', 'success');
    render();
  }

  $('#addCatBtn').addEventListener('click', () => openModal(null));
  $('#saveCatBtn').addEventListener('click', saveCategory);
  $$('[data-modal-close]').forEach(b => b.addEventListener('click', closeModal));
  $('#catModal').addEventListener('click', (e) => {
    if (e.target === $('#catModal')) closeModal();
  });

  render();
})();
</script>
</body>
</html>
