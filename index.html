<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusKart — متجر الجامعة</title>
  <meta name="description" content="متجر الجامعة CampusKart — كل ما تحتاجه في مكان واحد">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <div class="header-wrap">
      <a href="index.html" class="brand">
        <img src="assets/logo.svg" alt="CampusKart" class="brand-logo">
        <div class="brand-titles">
          <span class="brand-name" data-brand-name>CampusKart</span>
          <span class="brand-sub" data-brand-sub>متجر الجامعة</span>
        </div>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">الرئيسية</a>
        <a href="products.html">المنتجات</a>
        <a href="cart.html">السلة</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" data-theme-toggle aria-label="تبديل الوضع"></button>
        <a href="cart.html" class="icon-btn cart-btn" aria-label="السلة">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="cart-badge hidden" data-cart-badge>0</span>
        </a>
        <button class="icon-btn menu-btn" data-menu-toggle aria-label="القائمة">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ================= HERO (Editable) ================= -->
  <section class="hero" id="heroSection"></section>

  <!-- ================= CATEGORIES (moved to top) ================= -->
  <section class="section" id="categoriesSection">
    <div class="section-head">
      <h2>الأقسام</h2>
    </div>
    <div class="cats-grid" id="catsGrid"></div>
  </section>

  <!-- ================= ALL PRODUCTS ================= -->
  <section class="section">
    <div class="section-head">
      <h2>المنتجات</h2>
      <a href="products.html" class="link">عرض الكل ←</a>
    </div>
    <div class="products-grid" id="productsGrid">
      <div class="loader"><div class="spinner"></div></div>
    </div>
  </section>

  <!-- ================= FEATURES ================= -->
  <section class="features">
    <div class="features-inner" id="featuresRow"></div>
  </section>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <div class="footer-wrap">
      <div>
        <div class="footer-brand">
          <svg viewBox="0 0 128 128" fill="none">
            <path d="M22 44 L36 44 L36 34 C36 20 48 12 64 12 C80 12 92 20 92 34 L92 44 L106 44 C110 44 113 47 113 51 L110 112 C109.6 116 106 119 102 119 L26 119 C22 119 18.4 116 18 112 L15 51 C15 47 18 44 22 44 Z" fill="#C9A46A"/>
            <path d="M44 44 L44 34 C44 24 52 20 64 20 C76 20 84 24 84 34 L84 44" stroke="#C9A46A" stroke-width="6" fill="none" stroke-linecap="round"/>
          </svg>
          <div>
            <div class="footer-brand-text" data-brand-name>CampusKart</div>
            <div class="footer-brand-sub" data-brand-sub>متجر الجامعة</div>
          </div>
        </div>
        <p class="footer-tagline">كل ما تحتاجه من مستلزمات الجامعة والوجبات والمشروبات، بسعر مناسب وتوصيل داخل الحرم.</p>
      </div>
      <div class="footer-col">
        <h4>الموقع</h4>
        <ul>
          <li><a href="index.html">الرئيسية</a></li>
          <li><a href="products.html">المنتجات</a></li>
          <li><a href="cart.html">السلة</a></li>
        </ul>
      </div>
    </div>
    <div class="copy">© 2026 <span data-brand-name>CampusKart</span> — جميع الحقوق محفوظة.</div>
  </footer>

  <script src="js/data-store.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/shop.js"></script>
  <script>
    (async function() {
      await DataStore.load();
      Cart.load();
      Cart.purgeInvalidLines();
      UI.init();

      Shop.renderHero();
      Shop.renderCategories('#catsGrid');
      Shop.renderFeatures('#featuresRow');
      Shop.initSync();

      // كل المنتجات (المرئية فقط، مع احترام الترتيب)
      const all = DataStore.getProducts();
      Shop.renderProducts('#productsGrid', all);
    })();
  </script>
</body>
</html>
